<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Ears -->
  <circle cx="6" cy="6" r="5" fill="#010108" stroke="url(#g)" stroke-width="1.5"/>
  <circle cx="26" cy="6" r="5" fill="#010108" stroke="url(#g)" stroke-width="1.5"/>
  <!-- Inner ear -->
  <circle cx="6" cy="6" r="2.5" fill="url(#g)" opacity="0.3"/>
  <circle cx="26" cy="6" r="2.5" fill="url(#g)" opacity="0.3"/>
  <!-- Head -->
  <circle cx="16" cy="16" r="14" fill="#010108"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- Eyes (stars) -->
  <circle cx="11" cy="13" r="2.5" fill="#fff" opacity="0.95"/>
  <circle cx="21" cy="13" r="2.5" fill="#fff" opacity="0.95"/>
  <!-- Eye sparkle -->
  <circle cx="10" cy="12" r="0.8" fill="#8b5cf6"/>
  <circle cx="20" cy="12" r="0.8" fill="#8b5cf6"/>
  <!-- Snout / nose area -->
  <ellipse cx="16" cy="20" rx="4" ry="3" fill="url(#g)" opacity="0.25"/>
  <!-- Nostrils (tiny stars) -->
  <circle cx="14" cy="20" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="18" cy="20" r="1" fill="#fff" opacity="0.6"/>
</svg>
