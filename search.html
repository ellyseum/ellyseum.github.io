---
layout: default
title: Search
permalink: /search/
---
<div class="search-page">
  <section class="search-header">
    <h1 class="search-title">Search</h1>
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search posts..." autocomplete="off" spellcheck="false" aria-label="Search posts">
    </div>
    <div class="search-filters" id="search-filters" aria-live="polite"></div>
    <div class="search-count" id="search-count" aria-live="polite"></div>
  </section>

  <section class="search-results" id="search-results" aria-label="Search results"></section>

  <nav class="search-pagination" id="search-pagination" aria-label="Search pagination"></nav>
</div>

<script type="application/json" id="posts-data">
[{% for post in site.posts %}
  {
    "title": {{ post.title | jsonify }},
    "subtitle": {{ post.subtitle | default: "" | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": {{ post.date | date_to_xmlschema | jsonify }},
    "dateFormatted": {{ post.date | date: "%b %d, %Y" | jsonify }},
    "excerpt": {{ post.excerpt | strip_html | truncate: 160 | jsonify }},
    "tags": {{ post.tags | default: empty | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}]
</script>
